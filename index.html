<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROFIVE | Seleccione Idioma - 语言选择</title>
    <!-- Importación de Montserrat para coherencia de marca -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #83e31c; /* Verde oficial AEROFIVE */
            --dark: #1a1a1a;
            --white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: var(--white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--dark);
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Logotipo AEROFIVE en el portal */
        .logo-portal {
            max-width: 320px;
            margin-bottom: 3.5rem;
        }

        .portal-container {
            display: flex;
            gap: 70px;
            margin-bottom: 5rem;
        }

        .language-option {
            text-decoration: none;
            color: var(--dark);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .language-option:hover {
            transform: scale(1.08);
        }

        /* Ajuste de banderas: 90px (75%) y sin halos */
        .flag-img {
            width: 90px; 
            height: auto;
            border-radius: 4px;
            box-shadow: none !important;
            filter: none !important;
            display: block;
            margin: 0 auto 18px auto;
        }

        .lang-text {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Sección de contacto ampliada */
        .contact-info {
            border-top: 1px solid #eee;
            padding-top: 2.5rem;
            width: 100%;
            max-width: 550px;
        }

        .ceo-name {
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 6px;
            font-size: 1.35rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-info p {
            font-size: 1.15rem;
            margin: 10px 0;
            font-weight: 300;
        }

        .contact-info a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .contact-info a:hover {
            opacity: 0.7;
        }

        .contact-info i {
            margin-right: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Imagen del Logotipo Oficial -->
    <img src="Aerofive logo.png" alt="AEROFIVE" class="logo-portal">

    <!-- Selector de Idioma: China a la izquierda, España a la derecha -->
    <div class="portal-container">
        <!-- Opción Chino -->
        <a href="chino.html" class="language-option">
            <img src="china.png" alt="中文" class="flag-img">
            <span class="lang-text">中文</span>
        </a>
        
        <!-- Opción Español -->
        <a href="espanol.html" class="language-option">
            <img src="espana.png" alt="Español" class="flag-img">
            <span class="lang-text">Español</span>
        </a>
    </div>

    <!-- Información de Contacto Directo -->
    <div class="contact-info">
        <p class="ceo-name">Jose Carlos Tarifa Diaz</p>
        <p>Fundador & CEO AEROFIVE</p>
        <p><i class="fas fa-envelope"></i> <a href="mailto:info@josetarifa.es">info@josetarifa.es</a></p>
        <p><i class="fas fa-phone"></i> <a href="tel:+34656335105">+34 656 335 105</a></p>
    </div>

</body>
</html>
